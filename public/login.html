<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Gaurav Restaurant</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <form class="panel form-panel login-card" id="loginForm">
        <a class="brand login-brand" href="/"><span>GR</span>Gaurav Restaurant</a>
        <div>
          <p class="eyebrow">Admin panel home</p>
          <h1>Owner Login</h1>
          <p>Email aur password se login karke menu, bookings, aur orders manage karo.</p>
        </div>
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Login</button>
        <p class="status" id="loginStatus"></p>
        <small>Local demo email: owner@gauravrestaurant.local<br>Password: admin123</small>
      </form>
    </main>
    <script src="login.js"></script>
  </body>
</html>
